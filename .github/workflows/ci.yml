name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wizzybrass/streetcred-contracts build

  sdk:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wizzybrass/streetcred-contracts build
      - run: pnpm --filter @wizzybrass/streetcred-sdk build
      - run: pnpm --filter @wizzybrass/streetcred-sdk lint

  cli:
    runs-on: ubuntu-latest
    needs: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wizzybrass/streetcred-contracts build
      - run: pnpm --filter @wizzybrass/streetcred-sdk build
      - run: pnpm --filter @wizzybrass/streetcred-cli build
      - run: pnpm --filter @wizzybrass/streetcred-cli lint
